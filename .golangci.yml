version: "2"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(gopkg.d7z.net/nebula)
        - blank
        - default
    gofumpt:
      extra:
        group-params: true
  exclusions:
    generated: lax
