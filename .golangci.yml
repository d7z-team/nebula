version: "2"

run:
  timeout: 10m

output:
  sort-order:
    - file

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - errcheck
    - gocheckcompilerdirectives
    - gocritic
    - govet
    - ineffassign
    - mirror
    - nakedret
    - nilnil
    - nolintlint
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
  settings:
    errcheck:
      verbose: true
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf(net/http.ResponseWriter)
        - io.WriteString(net/http.ResponseWriter)
    gocritic:
      enabled-checks:
        - equalFold
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    govet:
      enable:
        - nilness
        - unusedwrite
    nolintlint:
      require-explanation: true
      require-specific: true
    testifylint:
      disable:
        - empty
        - go-require
        - require-error
    usetesting:
      os-temp-dir: true
  exclusions:
    generated: lax
    rules:
      # Match network teardown by receiver type, e.g. (net.Conn).Close.
      - linters: [errcheck]
        text: '\b(net|http|quic-go|http3|yamux|gonet|nebula|portshare)\.\w+\)\.Close(WithError)?`'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(gopkg.d7z.net/nebula)
        - blank
        - default
    gofumpt:
      extra:
        group-params: true
  exclusions:
    generated: lax
