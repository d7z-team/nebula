name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - run: go test ./...
      - name: Run the public examples
        working-directory: examples
        shell: bash
        run: |
          for example in quickstart relay gateway pki portshare addressing anycast; do
            go run "./$example"
          done

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go test -race ./...
      - run: go test -race -count=1 ./e2e -args -portshare

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Verify IPv4 TTL and IPv6 hop limit with the deployment patch
        run: |
          go mod vendor
          git apply --directory=vendor/gvisor.dev/gvisor patches/gvisor-ipv4-ttl.patch
          go test -mod=vendor -race -count=1 -run '^TestNodeGVisorForwardingAndDetach$' ./e2e

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - run: go test -exec=true ./...
        env:
          GOOS: ${{ matrix.goos }}

  chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Run fixed fault scenarios with the race detector
        run: go test -race -count=1 -timeout=5m -run '^TestChaos' ./e2e -args -extended
      - name: Run extended scenarios on shared sockets
        run: go test -race -count=1 -timeout=5m ./e2e -args -extended -portshare
      - name: Replay ten bounded action sequences
        shell: bash
        run: |
          go test -c -o "$RUNNER_TEMP/mesh-e2e.test" ./e2e
          for seed in {1..10}; do
            "$RUNNER_TEMP/mesh-e2e.test" -test.v -test.run '^TestSeededChaos$' -test.timeout 3m -extended -seed "$seed"
          done
