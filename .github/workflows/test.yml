name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - run: go test ./...

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go test -race ./...

  fips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - run: go test . ./cert -run '^Test(Node|Packet|Generate|CreateCA)'
        env:
          GODEBUG: fips140=only

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true
      - run: go test -exec=true ./...
        env:
          GOOS: ${{ matrix.goos }}
