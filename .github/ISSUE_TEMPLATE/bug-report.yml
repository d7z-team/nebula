name: Bug report
description: Report an embedded library or wire compatibility problem
title: "bug: "
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: Include the relevant Options, transport behavior, and a minimal Go reproducer. Remove certificate private keys.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, Go version, OS, certificate version/curve, and cipher.
    validations:
      required: true
  - type: textarea
    id: interoperability
    attributes:
      label: Interoperability details
      description: If an upstream peer is involved, include its version, role, relevant routes, and sanitized logs.
