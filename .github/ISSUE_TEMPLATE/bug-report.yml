name: 缺陷报告
description: 报告嵌入式网络库或传输问题
title: "bug: "
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为和预期结果。
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: 复现方法
      description: 提供相关选项、传输行为和最小 Go 示例。节点私钥和 CA 私钥请用占位符代替。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 提供提交号、Go 版本、操作系统、传输类型、协商参数和相关拓扑设置。
    validations:
      required: true
  - type: textarea
    id: path
    attributes:
      label: 路径信息
      description: 提供对端传输、活动路径、MTU 及相关的脱敏状态信息。
